<body>

  <!--FORMULARIO-->
  <div class="row">
    <div class="col-sm-3">

    </div>
    <div class="col-sm-6">
      <div class="container-form">
        <form>
          <div class="registro-titulo">
            <h4>REGISTRO DE USUARIO</h4>
          </div>

          <div class="mb-3">
            <label for="nombre-completo">NOMBRE COMPLETO</label>
            <input type="text" class="form-control" id="nombre-completo" placeholder="Ej: Juan Pérez" required>
          </div>

          <div class="mb-3">
            <label for="correo">CORREO</label>
            <input type="email" class="form-control" id="correo" placeholder="juan@ejemplo.com" required>
          </div>

          <div class="mb-3">
            <label for="contrasena">CONTRASEÑA</label>
            <input type="password" class="form-control" id="contrasena" placeholder="Ingresa tu contraseña" required>
          </div>

          <div class="mb-3">
            <label for="contrasena">CONFIRMAR CONTRASEÑA</label>
            <input type="password" class="form-control" id="confirmarcontrasena" placeholder="Repite tu contraseña"
              required>
          </div>

          <div class="mb-3">
            <label for="telefono">TELÉFONO (OPCIONAL)</label>
            <input type="tel" class="form-control" id="telefono" placeholder="+569 1234 5678">
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="slcregion" class="form-label">-- REGIÓN --</label>
                <select class="form-control" id="slcregion" required>
                  <option value="">Seleccione una región</option>
                </select>
              </div>
            </div>

            <div class="col-md-6">
              <div class="mb-3">
                <label for="slccomuna" class="form-label">-- COMUNA --</label>
                <select class="form-control" id="slccomuna" disabled required>
                  <option value="">Seleccione una comuna</option>
                </select>
              </div>
            </div>
          </div>

          <div class="text-center">
            <button type="submit" class="btn btn-primary btn-lg px-5 mt-4">Registrarse</button>
          </div>
        </form>
      </div>
    </div>

    <div class="col-sm-3">
    </div>
  </div>

  <script>
    // Se utilizarán solamente las regiones en las que el negocio hace repartos
    // Para esto crearemos el siguiente objeto, que tendrá como clave el nombre de la región y el arreglo con sus comunas
    const regionesYComunas =
    {
      "Metropolitana de Santiago":
        ["Santiago", "Providencia", "Las condes", "Vitacura", "Lo Barnechea", "Ñunoa", "La Reina",
          "La Granja", "San Ramón", "El Bosque", "La Pintana", "La Florida", "Peñalolén", "Maipú", "Cerrillos", "Pudahuel", "Estación Central",
          "Recoleta", "Independencia", "Conchalí"
        ],
      "Valparaíso":
        [
          "Valparaíso", "Viña del mar", "Concón", "Casablanca", "Puchuncaví", "Quintero", "Juan Fernández", "Quilpué", "Villa Alemana", "Limache", "Olmué",
          "San Antonio", "Cartagena", "El Tabo", "El Quisco", "Algarrobo", "Santo Domingo", "Quillota", "La Calera", "Cruz", "Hijuelas", "Nogales", "San Felipe", "Llaillay",
          "Catemu", "Panquehue", "Putaendo", "Santa María", "Los Andes", "San Esteban", "Calle Larga", "Rinconada", "La Ligua", "Cabildo", "Petorca", "Papudo", "Zapallar"
        ],
      "Región del Libertador General Bernardo O'Higgins":
        [
          "Rancagua", "Machalí", "Graneros", "San Francisco de Mostazal", "Doñihue", "Coltauco", "Coinco", "Olivar", "Requínoa", "Rengo", "Malloa", "Quinta de Tilcoco",
          "San Vicente de Tagua Tagua", "Pichidegua", "Peumo", "Las Cabras", "San Fernando", "Santa Cruz", "Chimbarongo", "San Vicente", "Nancagua", "Placilla", "Palmilla",
          "Peralillo", "Chépica", "Lolol", "Pumanque", "Pichilemu", "Marchigüe", "Litueche", "La Estrella", "Navidad", "Paredones"
        ]
    };

    const slcregion = document.getElementById('slcregion');
    const slccomuna = document.getElementById('slccomuna')

    function cargarRegiones() {
      // Se obtienen las regiones del objeto creado anteriormente y se ordenan por nombre
      const regiones = Object.keys(regionesYComunas).sort();

      regiones.forEach(region => {
        const option = document.createElement('option');
        option.value = region;
        option.textContent = region;
        slcregion.appendChild(option)
      });
    }

    function actualizarComuna() {
      const region = slcregion.value; // Se obtiene la comuna elegida

      slccomuna.innerHTML = '<option value="">Seleccione una comuna</option>';

      // Si se selecciona la opción 'Seleccione una región' deberá poner en comuna el mensaje a través de innerHTML
      if (region === '') {
        slccomuna.disabled = true;
        slccomuna.innerHTML = '<option value="">Primero seleccione una región</option>';
        return;
      }

      const comunas = regionesYComunas[region];

      slccomuna.disabled = false;

      comunas.sort().forEach(comuna => {
        const option = document.createElement('option');
        option.value = comuna;
        option.textContent = comuna;
        slccomuna.appendChild(option);
      });
    }

    slcregion.addEventListener('change', actualizarComuna);

    cargarRegiones();

    //Validamos la contraseñas y el correo, si no se cumplen le devolvemos al usuario un mensaje
    const formulario = document.querySelector("form");

    formulario.addEventListener("submit", function (event) {

      const contrasena = document.getElementById("contrasena").value;
      const confirmarcontrasena = document.getElementById("confirmarcontrasena").value;
      const correo = document.getElementById("correo").value

      if (correo.length > 100) {
        alert("El correo debe tener un máximo de 100 caracteres");
        event.preventDefault();
        return;
      }

      if (!correo.endsWith("@duoc.cl") && !correo.endsWith("@profesor.duoc.cl") && !correo.endsWith("@gmail.com")) {
        alert("El correo debe ser un @gmail.com o un @profesor.duoc.cl o un @duoc.cl")
        event.preventDefault();
        return;
      }

      if (contrasena.length < 4) {
        alert("La contraseña debe tener al menos 4 caracteres");
        event.preventDefault();
        return;
      }

      if (contrasena.length > 10) {
        alert("La contraseña no debe tener más de 10 caracteres");
        event.preventDefault();
        return;
      }

      if (contrasena !== confirmarcontrasena) {
        alert("Las contraseñas no coinciden");
        event.preventDefault(); //sirve para detener el envío del formulario si las contraseñas no son iguales
        return;
      }
    });
  </script>
</body>

</html>
